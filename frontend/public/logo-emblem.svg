<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" fill="none">
  <defs>
    <linearGradient id="emblemGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="emblemRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B72E24" />
      <stop offset="60%" stop-color="#931A13" />
      <stop offset="100%" stop-color="#6E0F0A" />
    </linearGradient>

    <filter id="emblemGlowAroma" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ================= AUTHENTIC CULINARY MEDALLION ================= -->
  <g transform="translate(7, 5)" filter="url(#emblemGlowAroma)">
    <!-- Vòng Tròn Đĩa Men Cung Đình -->
    <circle cx="38" cy="40" r="34" stroke="url(#emblemGoldGrad)" stroke-width="1.4" stroke-dasharray="140 10 30 10" opacity="0.75" />
    <circle cx="38" cy="40" r="37.5" stroke="url(#emblemGoldGrad)" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.45" />

    <!-- Bông Lúa Hạt Ngọc Trời (Bên Trái) -->
    <path d="M 14,56 C 12,42 16,28 25,18" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <ellipse cx="14" cy="48" rx="2.5" ry="4.5" transform="rotate(-30 14 48)" fill="url(#emblemGoldGrad)" />
    <ellipse cx="16" cy="38" rx="2.5" ry="4.5" transform="rotate(-20 16 38)" fill="url(#emblemGoldGrad)" />
    <ellipse cx="20" cy="28" rx="2.4" ry="4.2" transform="rotate(-10 20 28)" fill="url(#emblemGoldGrad)" />
    <ellipse cx="26" cy="20" rx="2.2" ry="3.8" transform="rotate(5 26 20)" fill="url(#emblemGoldGrad)" />

    <!-- Chiếc Thố / Bát Sứ Ẩm Thực (Fine-Dining Heritage Bowl) -->
    <path d="M 21,43 C 21,62 55,62 55,43 Z" fill="url(#emblemRedGrad)" />
    <path d="M 21,43 C 21,62 55,62 55,43" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="38" cy="43" rx="17" ry="4.5" fill="#1C1917" stroke="url(#emblemGoldGrad)" stroke-width="1.6" />
    <path d="M 31,62 L 45,62" stroke="url(#emblemGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Đôi Đũa Hoàng Gia Khảm Vàng -->
    <line x1="22" y1="48" x2="63" y2="28" stroke="url(#emblemGoldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <line x1="25" y1="52" x2="66" y2="32" stroke="url(#emblemGoldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="22" cy="48" r="1.4" fill="#FFFFFF" />
    <circle cx="25" cy="52" r="1.4" fill="#FFFFFF" />

    <!-- 3 Làn Khói Hương Vị Đa Giác Quan -->
    <path d="M 33,39 C 30,31 36,25 33,16" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
    <path d="M 38,38 C 42,28 35,21 39,11" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
    <path d="M 43,40 C 46,33 41,26 44,18" fill="none" stroke="url(#emblemGoldGrad)" stroke-width="1.4" stroke-linecap="round" opacity="0.75" />

    <!-- Hạt Ngọc Châu Đỉnh Khói -->
    <circle cx="39" cy="8.5" r="2.5" fill="url(#emblemGoldGrad)" />
  </g>
</svg>
