services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vi_viet_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: root_test_password
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
